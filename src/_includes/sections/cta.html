<!-- ============================================ -->
<!--                    CTA                       -->
<!-- ============================================ -->

<section id="cta-2573">
    <div class="cs-container">
        <div class="cs-wrapper">
            <div class="cs-content">
                <span class="cs-topper">Let's Talk</span>
                <h2 class="cs-title">Start With a Conversation</h2>
                <p class="cs-text">
                    Whether you're shopping for land or already comparing builder bids, there's a starting point that fits where you are today.
                </p>
            </div>
            <a href="/contact/" class="cs-button-solid">Schedule Appointment</a>
        </div>
        <div class="cs-card">
            <picture class="cs-picture">
                <source srcset="{% getUrl "/assets/images/cta-call-card-portrait.jpg" | resize({ width: 700 }) | avif %}" type="image/avif">
                <source srcset="{% getUrl "/assets/images/cta-call-card-portrait.jpg" | resize({ width: 700 }) | webp %}" type="image/webp">
                <source srcset="{% getUrl "/assets/images/cta-call-card-portrait.jpg" | resize({ width: 700 }) | jpeg %}" type="image/jpeg">
                <img src="{% getUrl "/assets/images/cta-call-card-portrait.jpg" | resize({ width: 700 }) | jpeg %}" alt="Smiling man in a coral polo standing in front of a grey house with a white picket fence" width="308" height="240" loading="lazy" decoding="async">
            </picture>
            <div class="cs-flex">
                <span class="cs-label">Prefer to Talk First?</span>
                <a href="tel:{{ client.phoneForTel }}" class="cs-phone">Call: {{ client.phoneFormatted }}</a>
            </div>
        </div>
    </div>

    <picture class="cs-background">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/cta-bg.jpg" | resize({ width: 900 }) | avif %}" type="image/avif">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/cta-bg.jpg" | resize({ width: 900 }) | webp %}" type="image/webp">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/cta-bg.jpg" | resize({ width: 900 }) | jpeg %}" type="image/jpeg">
        <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/cta-bg.jpg" | resize({ width: 1920 }) | avif %}" type="image/avif">
        <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/cta-bg.jpg" | resize({ width: 1920 }) | webp %}" type="image/webp">
        <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/cta-bg.jpg" | resize({ width: 1920 }) | jpeg %}" type="image/jpeg">
        <img src="{% getUrl "/assets/images/cta-bg.jpg" | resize({ width: 1920 }) | jpeg %}" alt="Aerial view of wooden chalets and a ski lift in an evergreen forest" width="1920" height="629" loading="lazy" decoding="async">
    </picture>
    <img class="cs-separator" src="/assets/svgs/separator.svg" alt="" width="1920" height="31" loading="lazy" decoding="async" aria-hidden="true">
</section>
