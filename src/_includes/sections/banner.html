<!-- ============================================ -->
<!--                   Banner                     -->
<!-- ============================================ -->

<div id="banner-310">
    <div class="cs-container">
        <h1 class="cs-int-title">{{ bannerTitle }}</h1>
        <nav class="cs-breadcrumbs" aria-label="Breadcrumb">
            <a href="/" class="cs-link">Home</a>
            {% if bannerParentTitle %}
                <a href="{{ bannerParentUrl }}" class="cs-link">{{ bannerParentTitle }}</a>
            {% endif %}
            <a href="{{ page.url }}" class="cs-link cs-active" aria-current="page">{{ bannerCrumb or bannerTitle }}</a>
        </nav>
    </div>
    <picture class="cs-background">
        <source media="(max-width: 600px)" srcset="{% getUrl bannerImage | resize({ width: 800 }) | avif %}" type="image/avif">
        <source media="(max-width: 600px)" srcset="{% getUrl bannerImage | resize({ width: 800 }) | webp %}" type="image/webp">
        <source media="(max-width: 600px)" srcset="{% getUrl bannerImage | resize({ width: 800 }) | jpeg %}" type="image/jpeg">
        <source media="(min-width: 601px)" srcset="{% getUrl bannerImage | resize({ width: 1920 }) | avif %}" type="image/avif">
        <source media="(min-width: 601px)" srcset="{% getUrl bannerImage | resize({ width: 1920 }) | webp %}" type="image/webp">
        <source media="(min-width: 601px)" srcset="{% getUrl bannerImage | resize({ width: 1920 }) | jpeg %}" type="image/jpeg">
        <img src="{% getUrl bannerImage | resize({ width: 1920 }) | jpeg %}" alt="{{ bannerAlt }}" width="1920" height="480" loading="eager" decoding="async" fetchpriority="high">
    </picture>
    <img class="cs-separator" src="/assets/svgs/separator.svg" alt="" width="1920" height="31" decoding="async" aria-hidden="true">
</div>
