<!--                   Reviews                    -->
<!-- ============================================ -->

<section id="reviews-2539">
    <div class="cs-container">
        <div class="cs-content">
            <span class="cs-topper">Client Voices</span>
            <h2 class="cs-title">What Owners Say <br class="cs-break">About Working With Me</h2>
        </div>
        <ul class="cs-card-group">
            {%- for review in reviews %}
            <li class="cs-item">
                <div class="cs-review-group">
                    <img class="cs-quote" src="/assets/svgs/icon-quote.svg" alt="" width="32" height="24" aria-hidden="true" loading="lazy" decoding="async">
                    <div class="cs-text-group">
                        <h3 class="cs-h3">{{ review.headline }}</h3>
                        <p class="cs-review">{{ review.text }}</p>
                    </div>
                </div>
                <div class="cs-flex-group">
                    <span class="cs-initial" aria-hidden="true">{{ review.name | first }}</span>
                    <span class="cs-name">
                        {{ review.name }}
                        <span class="cs-job">{{ review.location }}</span>
                    </span>
                </div>
            </li>
            {%- endfor %}
        </ul>
        <a href="/reviews/" class="cs-button-solid">Explore All Reviews</a>
    </div>
    <picture class="cs-background" aria-hidden="true">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/testimonials-bg.jpg" | resize({ width: 600, height: 1200 }) | avif %}" type="image/avif">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/testimonials-bg.jpg" | resize({ width: 600, height: 1200 }) | webp %}" type="image/webp">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/testimonials-bg.jpg" | resize({ width: 600, height: 1200 }) | jpeg %}" type="image/jpeg">
        <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/testimonials-bg.jpg" | resize({ width: 1920, height: 1053 }) | avif %}" type="image/avif">
        <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/testimonials-bg.jpg" | resize({ width: 1920, height: 1053 }) | webp %}" type="image/webp">
        <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/testimonials-bg.jpg" | resize({ width: 1920, height: 1053 }) | jpeg %}" type="image/jpeg">
        <img src="{% getUrl "/assets/images/testimonials-bg.jpg" | resize({ width: 1920, height: 1053 }) | jpeg %}" alt="" width="1920" height="1053" loading="lazy" decoding="async">
    </picture>
</section>
